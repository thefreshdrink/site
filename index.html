<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alisik</title>
<meta name="description" content="portfolio">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="logo" href="#top" aria-label="alisik — наверх"><img src="assets/logo.png" alt="alisik"></a>

  <main id="top">
    <div class="pager" id="pager" tabindex="0" aria-label="работы, листается по группам"></div>
  </main>

  <div class="hud" id="hud" hidden>
    <span class="hud-label" id="hud-label"></span>
    <span class="hud-track"><span class="hud-fill" id="hud-fill"></span></span>
    <div class="hud-nav">
      <button class="hud-btn" id="page-prev" aria-label="предыдущая группа">‹</button>
      <button class="hud-btn" id="page-next" aria-label="следующая группа">›</button>
    </div>
  </div>

  <div class="lb" id="lb" hidden>
    <button class="lb-btn lb-close" aria-label="закрыть">✕</button>
    <button class="lb-btn lb-prev" aria-label="предыдущая">‹</button>
    <img class="lb-img" id="lb-img" alt="">
    <button class="lb-btn lb-next" aria-label="следующая">›</button>
  </div>

  <script src="js/images.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
