<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alisik</title>
<meta name="description" content="portfolio">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main id="top">
    <div class="board" id="board" tabindex="0" aria-label="работы"></div>
  </main>

  <!-- desktop chrome -->
  <footer class="bar">
    <button type="button" class="bar-where" id="bar-where"><span>where</span> <span>am I?</span></button>
    <a class="bar-logo" href="#top" aria-label="alisik — наверх"><img src="assets/logo.png" alt="alisik"></a>
  </footer>

  <!-- phone chrome -->
  <header class="mbar mbar-top">
    <button type="button" class="mtxt"><span>wtf</span><span>is this?</span></button>
  </header>
  <footer class="mbar mbar-bot">
    <button type="button" class="mtxt"><span>please</span><span>don't call me</span></button>
  </footer>

  <div class="lb" id="lb" hidden>
    <button class="lb-btn lb-close" aria-label="закрыть">✕</button>
    <button class="lb-btn lb-prev" aria-label="предыдущая">‹</button>
    <img class="lb-img" id="lb-img" alt="">
    <button class="lb-btn lb-next" aria-label="следующая">›</button>
  </div>

  <script src="js/images.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
